# Конфигурация вспышек для LightServer.v3 (авто-поиск: config/blocks/51-light-hardware.yaml).
# Оркестратор и другие сервисы этот файл не читают.
#
# Ethernet MV-LE + COM MV-LE (camera id 2 и 7 — центральные).
# Bank On/Off: POST /api/camera-flash/bank (Ethernet + COM).

light_hardware:
  initialize_on_startup: true

  devices:
    # Центральные вспышки (camera id 2 и 7): один контроллер, 2 канала.
    - id: com2
      enabled: true
      type: com
      com_port: COM2
      channels: 2
    - id: mv-le-1
      enabled: true
      type: ethernet
      ip: "169.254.220.4"
      channels: 4
    - id: mv-le-2
      enabled: true
      type: ethernet
      ip: "169.254.220.3"
      channels: 4
    - id: mv-le-3
      enabled: true
      type: ethernet
      ip: "169.254.220.2"
      channels: 4
    - id: mv-le-4
      enabled: true
      type: ethernet
      ip: "169.254.220.1"
      channels: 4

  # POST /api/camera-flash/pair — routes с 2+ каналами; /single — 1 канал (COM).
  # camera_number = camera id + 1. COM: id 2→3, id 7→8; Ethernet: остальные id 0–9.
  camera_routes:
    - camera_number: 1
      device_id: mv-le-3
      channels: [2, 4]
    - camera_number: 2
      device_id: mv-le-4
      channels: [2, 4]
    - camera_number: 3
      device_id: com2
      channels: [1]
    - camera_number: 4
      device_id: mv-le-3
      channels: [1, 3]
    - camera_number: 5
      device_id: mv-le-4
      channels: [1, 3]
    - camera_number: 6
      device_id: mv-le-2
      channels: [2, 4]
    - camera_number: 7
      device_id: mv-le-1
      channels: [2, 4]
    - camera_number: 8
      device_id: com2
      channels: [2]
    - camera_number: 9
      device_id: mv-le-2
      channels: [1, 3]
    - camera_number: 10
      device_id: mv-le-1
      channels: [1, 3]
