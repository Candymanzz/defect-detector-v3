# Конфигурация вспышек для LightServer.v3 (авто-поиск: config/blocks/51-light-hardware.yaml).
# Оркестратор и другие сервисы этот файл не читают.
#
# Все вспышки — Ethernet MV-LE (GigE). Bank On/Off: POST /api/camera-flash/bank
# (постоянные GigE-сессии + Barrier по IP).

light_hardware:
  initialize_on_startup: true

  devices:
    # Только Ethernet MV-LE (COM убран — не работает).
    - id: mv-le-1
      enabled: true
      type: ethernet
      ip: "169.254.220.23"
      channels: 4
    - id: mv-le-2
      enabled: true
      type: ethernet
      ip: "169.254.220.22"
      channels: 4
    - id: mv-le-3
      enabled: true
      type: ethernet
      ip: "169.254.220.2"
      channels: 4
    - id: mv-le-4
      enabled: true
      type: ethernet
      ip: "169.254.220.1"
      channels: 4

  # POST /api/camera-flash/pair — routes с 2+ каналами.
  # Камеры 1–8 (id 0–7) на 4× MV-LE. Камеры 9–10 (id 8–9, 5-й коммутатор) — без вспышек.
  camera_routes:
    - camera_number: 1
      device_id: mv-le-1
      channels: [1, 2]
    - camera_number: 2
      device_id: mv-le-1
      channels: [3, 4]
    - camera_number: 3
      device_id: mv-le-2
      channels: [1, 2]
    - camera_number: 4
      device_id: mv-le-2
      channels: [3, 4]
    - camera_number: 5
      device_id: mv-le-3
      channels: [1, 2]
    - camera_number: 6
      device_id: mv-le-3
      channels: [3, 4]
    - camera_number: 7
      device_id: mv-le-4
      channels: [1, 2]
    - camera_number: 8
      device_id: mv-le-4
      channels: [3, 4]
