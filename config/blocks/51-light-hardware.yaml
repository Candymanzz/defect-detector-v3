# Конфигурация вспышек для LightServer.v3 (авто-поиск: config/blocks/51-light-hardware.yaml).
# Оркестратор и другие сервисы этот файл не читают.
#
# Ethernet MV-LE (камеры 1–8) + COM MV-LE (камеры 9–10, центральные).
# Bank On/Off: POST /api/camera-flash/bank (Ethernet + COM).

light_hardware:
  initialize_on_startup: true

  devices:
    # Центральные вспышки (камеры 9–10): один контроллер, 2 канала.
    - id: com1
      enabled: true
      type: com
      com_port: COM1
      channels: 2
    - id: mv-le-1
      enabled: true
      type: ethernet
      ip: "169.254.220.23"
      channels: 4
    - id: mv-le-2
      enabled: true
      type: ethernet
      ip: "169.254.220.22"
      channels: 4
    - id: mv-le-3
      enabled: true
      type: ethernet
      ip: "169.254.220.2"
      channels: 4
    - id: mv-le-4
      enabled: true
      type: ethernet
      ip: "169.254.220.1"
      channels: 4

  # POST /api/camera-flash/pair — routes с 2+ каналами; /single — 1 канал (COM).
  # Камеры 1–8 (id 0–7) — Ethernet; 9–10 (id 8–9) — COM1 ch1/ch2.
  camera_routes:
    - camera_number: 1
      device_id: mv-le-1
      channels: [1, 2]
    - camera_number: 2
      device_id: mv-le-1
      channels: [3, 4]
    - camera_number: 3
      device_id: mv-le-2
      channels: [1, 2]
    - camera_number: 4
      device_id: mv-le-2
      channels: [3, 4]
    - camera_number: 5
      device_id: mv-le-3
      channels: [1, 2]
    - camera_number: 6
      device_id: mv-le-3
      channels: [3, 4]
    - camera_number: 7
      device_id: mv-le-4
      channels: [1, 2]
    - camera_number: 8
      device_id: mv-le-4
      channels: [3, 4]
    - camera_number: 9
      device_id: com1
      channels: [1]
    - camera_number: 10
      device_id: com1
      channels: [2]
