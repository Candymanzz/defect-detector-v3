# Omron FINS/UDP — биты CIO 140/190/240 + таймауты D4400–D4404.
# Карта сигналов: plk/register-map.yaml (правьте area/address/direction там).
# Runtime-брак по умолчанию — дискретные DO (io_input_monitor_reject), не FINS.
# FINS для reject включается, если io_input_monitor_reject.enabled=false.

plc_fins:
  enabled: true
  host: "169.254.220.231"
  port: 9600
  dest_node: 231
  src_node: 254
  response_timeout_ms: 1000
  pulse_ms: 50
  queue_size: 64
  register_map_path: "plk/register-map.yaml"
  vision_ready_signal: "vision_ready"
  vision_fault_signal: "vision_fault"
