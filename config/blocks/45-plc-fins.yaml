# Omron FINS/UDP — при эталоне: vision_ready sticky HIGH, reject line1/line2 по ведру,
# vision_fault при аварии сервисов. Карта: plk/register-map.yaml.
# Discrete DO (io_input_monitor_reject) — только fallback, если FINS publisher не поднялся.

plc_fins:
  enabled: true
  host: "169.254.220.231"
  port: 9600
  dest_node: 231
  src_node: 254
  response_timeout_ms: 1000
  pulse_ms: 50
  queue_size: 64
  register_map_path: "plk/register-map.yaml"
  vision_ready_signal: "vision_ready"
  vision_fault_signal: "vision_fault"
