# IoInputMonitor — мониторинг Digital Input с MV IO Box.

# Авто-поиск: config/blocks/52-io-input.yaml (или IO_INPUT_CONFIG / --io-config=).


io_input:
  com_port: COM3
  edge: both            # rising | falling | both
  debounce_ms: 0
  configure_sdk: true
  inputs:
    - 1                 # DI1 = работа (конвейер)
    - 2                 # DI2 = направление
    - 3                 # DI3 = триггер съёмки

  # Техзрение → физические входы ПЛК (не FINS). FINS только таймауты D4400–D4404.
  # Проводка (Никита): DO1→готовность X4, DO2→ошибка X5, DO3→брак1 X6, DO4→брак2 X7.
  # DO5 занят Line0. CIO 240.15 «Сброс дискретных входов» не используем.
  reject:
    enabled: true
    ready_output_port: 1
    fault_output_port: 2
    line1_output_port: 3
    line2_output_port: 4
    pulse_duration_ms: 50
    active_high: true

  # DI3↑ → UDP (arm wait_frame) → delay → DO5 → Line0.
  capture:
    enabled: true
    direction_port: 2
    trigger_port: 3
    output_port: 5
    output_mode: direct
    # Согласовано с line0_trigger_activation в 01-core / config.json.
    line0_edge: rising
    active_high: true
    pulse_delay_ms: 250
    pulse_duration_ms: 300
    pulse_repeat: 1
    pulse_repeat_gap_ms: 100
    # DI2=1 один раз вооружает направление навсегда; дальнейшие DI2 — холостые.
    # DI3↑ → съёмка только после первого arm (и пока require_direction).
    require_direction: true
    direction_latch: true
    initial_direction: forward
    direction_http:
      enabled: true
      host: 127.0.0.1
      port: 9101

  publish:
    udp:
      enabled: true
      host: 127.0.0.1
      port: 9100          # куда слушает оркестратор (inspection_trigger.udp.bind_port)
      format: json        # json {"di":3,"value":1,"ts_ms":...} | text_di "3:1" | byte_di | byte/text (legacy 0/1)
      inputs: [1, 2, 3]   # какие DI публиковать; по умолчанию = inputs
      trigger_port: 3     # DI3 — не слать начальное состояние при старте (см. send_initial_trigger_state)
      low_latency_trigger: true   # DI1/DI2/DI3 — синхронный UDP из SDK callback, без очереди
      send_initial_state: true
      send_initial_trigger_state: false   # не слать DI3 при старте (ложный FIRE)
