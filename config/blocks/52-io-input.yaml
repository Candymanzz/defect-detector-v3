# IoInputMonitor — мониторинг Digital Input с MV IO Box.
# Авто-поиск: config/blocks/52-io-input.yaml (или IO_INPUT_CONFIG / --io-config=).

io_input:
  com_port: COM3
  edge: both            # rising | falling | both
  debounce_ms: 50       # аппаратный debounce (nGlitch) + фильтр дребезга в ПО
  configure_sdk: true   # both всегда требует SetInput; для rising/falling можно false
  inputs:
    - 3
