# IoInputMonitor — мониторинг Digital Input с MV IO Box.

# Авто-поиск: config/blocks/52-io-input.yaml (или IO_INPUT_CONFIG / --io-config=).


io_input:
  com_port: COM3
  edge: both            # rising | falling | both
  debounce_ms: 0
  configure_sdk: true
  inputs:
    - 3
    - 4

  publish:
    udp:
      enabled: true
      host: 127.0.0.1
      port: 9100          # куда слушает потребитель (оркестратор: inspection_trigger.udp.bind_port)
      format: json        # json {"di":3,"value":1} | text_di "3:1" | byte_di | byte/text (legacy 0/1)
      inputs: [3, 4]         # какие DI публиковать; по умолчанию = inputs
      send_initial_state: false