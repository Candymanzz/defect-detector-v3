# IoInputMonitor — мониторинг Digital Input с MV IO Box.

# Авто-поиск: config/blocks/52-io-input.yaml (или IO_INPUT_CONFIG / --io-config=).


io_input:
  com_port: COM3
  edge: both            # rising | falling | both
  # 0 = нет debounce → bounce заливает UDP/DO. 20–50 мс типично для контактов.
  debounce_ms: 20
  configure_sdk: true
  inputs:
    - 1                 # DI1 = работа (конвейер); ↓ снимает direction latch
    - 2                 # DI2 = направление
    - 3                 # DI3 = триггер съёмки

  # На ПЛК только брак: line1→DO3→X6, line2→DO4→X7.
  # ready/fault (DO1/DO2) выключены — HTTP /vision-ready|/vision-fault = skip.
  reject:
    enabled: true
    line1_output_port: 3
    line2_output_port: 4
    line1_plc_input: "X6"
    line2_plc_input: "X7"
    ready_enabled: false
    fault_enabled: false
    line1_enabled: true
    line2_enabled: true
    pulse_duration_ms: 50
    pulse_retries: 3
    active_high: true
    plc_cooldown_ms: 80

  # DI3↑ → UDP (arm wait_frame) → delay → DO6 импульс 300 ms.
  capture:
    enabled: true
    direction_port: 2
    trigger_port: 3
    work_port: 1
    # DI1↓ снимает latch — иначе после первого DI2=1 каждый DI3↑ шлёт DO/UDP forever.
    disarm_on_work_low: true
    output_port: 6
    output_ports: [6]   # только DO6 — простой level-импульс, без связки с DO5
    output_mode: direct
    # Согласовано с line0_trigger_activation в 01-core / config.json.
    line0_edge: rising
    active_high: true
    pulse_delay_ms: 250
    pulse_duration_ms: 300
    pulse_repeat: 1
    pulse_repeat_gap_ms: 100
    # DI2=1 один раз вооружает; DI1↓ (work) снимает. Дальнейшие DI2 до disarm — холостые.
    # DI3↑ → съёмка только после arm (и пока require_direction).
    require_direction: true
    direction_latch: true
    initial_direction: forward
    direction_http:
      enabled: true
      host: 127.0.0.1
      port: 9101

  publish:
    udp:
      enabled: true
      host: 127.0.0.1
      port: 9100          # куда слушает оркестратор (inspection_trigger.udp.bind_port)
      format: json        # json {"di":3,"value":1,"ts_ms":...} | text_di "3:1" | byte_di | byte/text (legacy 0/1)
      inputs: [1, 2, 3]   # какие DI публиковать; по умолчанию = inputs
      trigger_port: 3     # DI3 — не слать начальное состояние при старте (см. send_initial_trigger_state)
      low_latency_trigger: true   # DI1/DI2/DI3 — синхронный UDP из SDK callback, без очереди
      send_initial_state: true
      send_initial_trigger_state: false   # не слать DI3 при старте (ложный FIRE)
