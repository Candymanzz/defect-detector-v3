# IoInputMonitor — мониторинг Digital Input с MV IO Box.

# Авто-поиск: config/blocks/52-io-input.yaml (или IO_INPUT_CONFIG / --io-config=).


io_input:
  com_port: COM3
  edge: both            # DI1/DI2: both; DI3 в коде всегда Rising (импульс <10 мс)
  # DI3 ~10 мс: SDK Glitch=0. Soft refractory ≥80 мс режет bounce Rising.
  debounce_ms: 0
  configure_sdk: true
  inputs:
    - 1                 # DI1 = работа (конвейер); ↓ снимает direction latch
    - 2                 # DI2 = направление
    - 3                 # DI3 = триггер съёмки

  # Единственный DO: capture DO5 → Line0 камер. Брак/ready/fault — только FINS.
  # DI3↑ → UDP (arm wait_frame) → delay → один DO5↑ (RisingEdge на Line0).
  capture:
    enabled: true
    direction_port: 2
    trigger_port: 3
    work_port: 1
    # DI1↓ снимает latch — иначе после первого DI2=1 каждый DI3↑ шлёт DO/UDP forever.
    disarm_on_work_low: true
    output_port: 5
    output_ports: [5]   # только DO5 → Line0
    output_mode: direct
    # Согласовано с line0_trigger_activation в 01-core / config.json.
    line0_edge: rising
    active_high: true
    pulse_delay_ms: 250
    # RisingEdge: короткий HIGH; камеры уже в wait_frame (ClearImageBuffer, без drain).
    pulse_duration_ms: 50
    pulse_repeat: 1
    pulse_repeat_gap_ms: 100
    # Съёмка только при DI2=1: первый DI3↑ → DO5; повторный DI3↑ пока DI2 ещё 1 — холостой.
    # Без latch — уровень DI2 проверяется на каждом DI3; новое окно после DI2↓↑.
    require_direction: true
    direction_latch: false
    initial_direction: forward
    direction_http:
      enabled: true
      host: 127.0.0.1
      port: 9101

  publish:
    udp:
      enabled: true
      host: 127.0.0.1
      port: 9100          # куда слушает оркестратор (inspection_trigger.udp.bind_port)
      format: json        # json {"di":3,"value":1,"ts_ms":...} | text_di "3:1" | byte_di | byte/text (legacy 0/1)
      inputs: [1, 2, 3]   # какие DI публиковать; по умолчанию = inputs
      trigger_port: 3     # DI3 — не слать начальное состояние при старте (см. send_initial_trigger_state)
      low_latency_trigger: true   # DI1/DI2/DI3 — синхронный UDP из SDK callback, без очереди
      send_initial_state: true
      send_initial_trigger_state: false   # не слать DI3 при старте (ложный FIRE)
