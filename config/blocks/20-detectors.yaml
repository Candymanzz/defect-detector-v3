java_geometry:
  pixels_to_mm: 0.01
  main_roi: { x: 0, y: 0, width: 2448, height: 2048 }
  joint_roi: null
  wrinkles_roi: null
  max_shift_mm: 0.5
  max_rotation_deg: 1.0
  max_concentricity_mm: 0.2
  max_joint_defect_mm: 0.3
  # Совпадает с python_detector.fallback_threshold, если не задан runtime threshold с фронта.
  # 0.45 снижает ложный брак на стабильных одинаковых кадрах.
  max_wrinkles_score: 0.45

python_detector:
  # FastAPI analisSurface — оркестратор поднимает uvicorn сам (integration.analis_surface_*).
  base_url: "http://127.0.0.1:8000"
  # Downscale кадров перед inspect_shm (дублирует capture_frame_downscale, если тот выключен).
  inspect_scale: 0.8
  rois:
    - name: main
      x: 0
      y: 0
      width: 2448
      height: 2048
  # Более безопасный рабочий порог: меньше ложных REJECT при микро-шуме/свете.
  fallback_threshold: 0.45
  # UI heatmap is written at this width after the full-resolution inspection decision is calculated.
  ui_heatmap_max_width: 512
  include_visuals: false
