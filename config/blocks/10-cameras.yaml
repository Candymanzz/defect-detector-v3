  # id в ПО ↔ LAN на линии. IP должны совпадать в config.json.
  - id: 0
    enabled: true
    inspection_enabled: true
    ip: "169.254.95.219"
    exposure_us: 3000
    capture_trigger_mode: "line0"
    detector: "v1"
    pipe_command: "\\\\.\\pipe\\camera-0-cmd"
    analysis_profile: "bench-lan1"
    pipe_command_linux: "/tmp/camera-0-cmd.sock"
