# Подсветка → LightServer.v3: три типа URL — вкл, выкл, яркость по камерам.
# Маршруты вспышек (camera_number ↔ device/channel) — в config/blocks/51-light-hardware.yaml.
light_servers:
  # Единый LightServer управляет Ethernet MV-LE и COM-вспышками.
  enabled: true
  base_url: "http://127.0.0.1:5080"
  urls:
    on: /api/camera-flash/bank
    off: /api/camera-flash/bank
    brightness_pair: /api/camera-flash/pair
    brightness_single: /api/camera-flash/single
    # Готовность Ethernet-банка (не COM).
    status: /api/camera-flash/bank
  # hold_mode: capture НЕ трогает вспышки (On/Off только вне пайплайна).
  # При interval_flash яркость задаётся при старте; On/Off — по DI (см. ниже).
  hold_mode: true
  fail_on_error: false
  timeout_ms: 20000
  brightness_percent: 80
  duration_ms: 90
  flash_lead_ms: 0
  settle_delay_ms: 0
  # Интервальный режим (отдельный контур от съёмки):
  # DI3↑ → On; Off по первому wait_frame (или timeout off_delay_ms);
  # после Off → авто-On через on_reengage_delay_ms.
  # On/Off — POST /api/camera-flash/bank (не трогает capture pipeline).
  interval_flash:
    enabled: true
    idle_port: 2
    idle_edge: falling
    idle_on: false
    trigger_port: 3
    trigger_edge: rising
    # Гасить на первом usable кадре после DI3↑.
    off_on_first_frame: true
    # Аварийный timeout, если wait_frame не пришёл.
    off_delay_ms: 1000
    # Зажечь снова через 5 с после гашения.
    on_reengage_delay_ms: 5000
    start_dark: true
  # cameras опционально; по умолчанию — все enabled cameras из корневого конфига.
  # mode: pair (id 0–7, Ethernet) | single (id 8–9, COM1 центральные) — см. 51-light-hardware.yaml.
