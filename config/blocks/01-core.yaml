version: 1

frame:
  width: 1224
  height: 1024
  # Mono8: ~3x меньше GigE-трафика; camera-worker конвертирует в BGR8 для пайплайна.
  format: Mono8
  # Binning 2×2 в MVS; если SDK вернёт 0x80000109 — worker применит ROI 1224×1024 по центру.
  binning_horizontal: 2
  binning_vertical: 2
  binning_mode: "Sum"

capture_source: "hik"
# DI3 UDP → wait_frame; экспозиция по DO5→Line0.
capture_trigger_mode: "line0"
line0_trigger_activation: "RisingEdge"
line0_line_inverter: false
frame_timeout_ms: 15000
# GigE-топология: 5 коммутаторов, на каждом 2 камеры (пары id: 0+1, 2+3, … 8+9).
# gige_switch_buffer_kb — физический egress коммутатора (448 КБ). Должен совпадать с железом.
gige_switch_count: 5
gige_cameras_per_switch: 2
gige_switch_buffer_kb: 448
# GevSCPD (тики ~8 нс): при 448 КБ можно ниже, чем на 48 КБ. 10000 ≈ 80 мс/кадр Mono8 1224×1024.
# Если resend/потери — поднять до 15000–20000; если медленно — снизить до 8000.
gige_inter_packet_delay: 10000
# 0 = авто (~13 мс слот GevSCFTD на 1224×1024 при 448 КБ); разнесение 2 камер на коммутаторе.
gige_frame_transfer_delay_step: 0
# 2 = две камеры на коммутатор; передача волнами 0,2,4,6,8 затем 1,3,5,7,9.
gige_ftd_cameras_per_link: 2

orchestrator:
  control_pipe: "\\\\.\\pipe\\iml-orchestrator"
  control_pipe_linux: "/tmp/iml-orchestrator.sock"

# camera — эталон снимается с камеры при старте; client — только client.reference_bundle по WebSocket.
integration:
  reference_source: client
  # Съёмка по внешнему триггеру даже без client.reference_bundle (geometry/python — после эталона).
  capture_without_reference: true
  # Автосъёмка для UI отключена — кадры только по внешнему триггеру (IoInputMonitor → inspection_trigger).
  live_preview:
    enabled: false
    flash_on_tick: false
    interval_ms: 8000
  camera_parallelism: 10
  # 0 = все камеры получают триггер одновременно; разнесение трафика — GevSCFTD в camera-worker.
  capture_trigger_stagger_ms: 0
  simultaneous_line_capture:
    enabled: true
    barrier_wait_ms: 0
    post_trigger_settle_ms: 0
    inter_wait_frame_ms: 0
    parallel_wait_frame: true
    # 1 волна: GevSCFTD разносит передачу 2 камер на коммутаторе; при сбое GevSCFTD — поставить 2.
    transfer_wait_waves: 1
    # Пауза между волнами wait_frame (только если transfer_wait_waves > 1). При 448 КБ достаточно ~15 мс.
    transfer_wave_gap_ms: 15
    # true: экспозиция по DI3→DO5→Line0; Java только wait_frame.
    hardware_line_trigger: true
    # false: не слать trigger_only — кадр только от DO5/Line0.
    immediate_prefire: false
  geometry_pool_size: 10
  positioning_pool_size: 10
  python_parallelism: 10
  # Один процесс uvicorn; 10 HTTP-клиентов к :8000. Без этого — 10 uvicorn × модели ≈ ×10 RAM.
  python_server_pool_size: 1
  stage_queue_size: 20
  # Таймаут RPC к camera-worker (health/capture/inspect). Для 10 камер увеличен, чтобы избежать ложных startup timeout.
  worker_command_timeout_ms: 30000
  # Пауза между последовательным запуском воркеров камер (смягчает пик инициализации SDK/MVS).
  worker_startup_stagger_ms: 1200
  # Таймаут health/check для внешних сервисов (geometry/python bridge).
  service_command_timeout_ms: 15000
  worker_ipc_mode: "stdio"
  worker_named_pipe_template: "\\\\.\\pipe\\iml-camera-%d-binary"
  worker_named_pipe_template_linux: "/tmp/iml-camera-%d.pipe"
  worker_named_pipe_connect_timeout_ms: 3000
  # Дать dotnet/LightServer подняться до первого trigger (особенно при dotnet run + build).
  light_server_startup_delay_ms: 8000
  # Целевой SLA: 10 кадров параллельно ≤ 3.5 с (GigE stagger + downscale 0.5 + параллельный python).
  inspection_cycle_timeout_ms: 3500
  # Агрегация: mode=ten_cameras → группы 0–4 и 5–9, все 10 камер в инспекции.
  inspection_bucket:
    enabled: true
    mode: ten_cameras
    timeout_ms: 3500
    line_broadcast_interval_ms: 3500
  # Временная заглушка: цикл каждые N мс без внешнего триггера. Выключить при UDP-триггере с линии.
  dev_auto_trigger_stub:
    enabled: false
    interval_ms: 5000
  # Внешний триггер инспекции (когда dev_auto_trigger_stub и continuous_inspection выключены).
  inspection_trigger:
    udp:
      enabled: true
      bind_host: "0.0.0.0"
      bind_port: 9100
      # io_input: UDP от IoInputMonitor {"di":N,"value":0|1}; DI1=работа, DI2=направление, DI3=триггер
      format: io_input
      debounce_ms: 0
      # allowed_remote_hosts: ["127.0.0.1"]
    io_input:
      work_port: 1
      direction_port: 2
      trigger_port: 3
      direction_latch_on_work: false
      di3_only: true
      # Съёмка только при живом DI2=1 (без latch): DI3↑ при DI2=0 → skip.
      # DI3↑ + DI2=1 → wait_frame; экспозиция DO5→Line0.
      direction_latch: false
      capture_delay_ms: 0
      trigger_edge: rising
      payload_format: json
      debounce_ms: 0
      require_direction: true
      require_work: false
      external_hardware_capture: true
      direction_poll_ms: 1
  # UI «Прямой/Обратный» не фильтрует; гейт съёмки — уровень DI2.
  io_input_monitor_direction_url: "http://127.0.0.1:9101"
  # Видеопоток: WS client.stream_start/stop; кадры — GET /api/camera/{id}/stream.mjpeg (MJPEG).
  client_stream:
    default_max_fps: 20
    max_fps_cap: 30
  # Непрерывный цикл: вспышка → capture → geometry → python → вердикт (ПЛК + WebSocket UI).
  continuous_inspection:
    enabled: false
    cycle_delay_ms: 3500
  timing_stages_log:
    enabled: true
    file: "logs/pipeline-stages.jsonl"
  # Downscale на ПК отключён: разрешение уже уменьшено binning 2×2 на камере.
  capture_frame_downscale:
    enabled: false
    scale: 1.0
    apply_to_inspection_capture: true
    apply_to_reference_capture: true
    apply_to_client_reference_bundle: true
  # JPEG кадров из SHM в каталог относительно корня репозитория (эталон: ref_*, инспекция: cap_*).
  save_captures:
    enabled: false
    directory: "testimage"
    jpeg_quality: 0.92
  # Автозапуск uvicorn (как LightServer). Один раз: pip install в analisSurface/backend/.venv
  analis_surface_autostart:
    enabled: true
    # Потоков inspect в одном uvicorn (10 кадров с 10 камер параллельно).
    inspect_workers: 10
    working_dir: "analisSurface/backend"
    startup_timeout_ms: 180000
    health_path: "/health"
  analis_surface_command_windows:
    - "analisSurface/backend/.venv/Scripts/python.exe"
    - "-m"
    - "uvicorn"
    - "app.main:app"
    - "--host"
    - "127.0.0.1"
    - "--port"
    - "8000"
  analis_surface_command_linux:
    - "analisSurface/backend/.venv/bin/python"
    - "-m"
    - "uvicorn"
    - "app.main:app"
    - "--host"
    - "127.0.0.1"
    - "--port"
    - "8000"
  geometry_command_windows:
    - "java"
    - "-jar"
    - "java-geometry-service/target/java-geometry-service-0.1.0-SNAPSHOT.jar"
  geometry_command_linux:
    - "java"
    - "-jar"
    - "java-geometry-service/target/java-geometry-service-0.1.0-SNAPSHOT.jar"
  positioning_command_windows:
    - "java"
    - "-jar"
    - "java-positioning-service/target/java-positioning-service-0.1.0-SNAPSHOT.jar"
  positioning_command_linux:
    - "java"
    - "-jar"
    - "java-positioning-service/target/java-positioning-service-0.1.0-SNAPSHOT.jar"
  # LightServer.v3 — Ethernet MV-LE. Не использовать `dotnet run` (часто зависает до Kestrel).
  light_server_command_windows:
    - "dotnet"
    - "exec"
    - "LightServer.v3/bin/Release/net10.0/LightServer.dll"
    - "--urls"
    - "http://127.0.0.1:5080"
  light_server_command_linux:
    - "dotnet"
    - "exec"
    - "LightServer.v3/bin/Release/net10.0/LightServer.dll"
    - "--urls"
    - "http://127.0.0.1:5080"
  # IoInputMonitor — DI1/DI2/DI3 → UDP :9100 (см. blocks/52-io-input.yaml).
  io_input_monitor_autostart:
    enabled: true
    startup_delay_ms: 500
    working_dir: "."
  io_input_monitor_command_windows:
    - "dotnet"
    - "exec"
    - "IoInputMonitor/bin/Release/net10.0/IoInputMonitor.dll"
  io_input_monitor_command_linux:
    - "dotnet"
    - "exec"
    - "IoInputMonitor/bin/Release/net10.0/IoInputMonitor.dll"
  # Front-end (Vite + Electron) — npm run dev в front-end/.
  frontend_autostart:
    enabled: true
    startup_delay_ms: 3000
    working_dir: "front-end"
  frontend_command_windows:
    - "npm.cmd"
    - "run"
    - "dev"
  frontend_command_linux:
    - "npm"
    - "run"
    - "dev"
