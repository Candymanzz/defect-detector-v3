# Оркестратор читает YAML; camera-worker — config/config.json (должен совпадать по capture_source и integration.*).
# capture_source: fake | aravis | hik. Aravis — Linux + pkg-config arv-0.8. Hik — Windows + MVS SDK: у каждой камеры свой GigE (ip) и свой worker.
version: 1

frame:
  width: 2448
  height: 2048
  format: BGR8

capture_source: "hik"
# No external trigger yet: run in continuous mode.
capture_trigger_mode: "continuous"
frame_timeout_ms: 4000

orchestrator:
  control_pipe: "\\\\.\\pipe\\iml-orchestrator"
  control_pipe_linux: "/tmp/iml-orchestrator.sock"

cameras:
  # id в ПО ↔ LAN на линии. IP должны совпадать в config.json.
  - id: 0
    enabled: true
    inspection_enabled: true
    ip: "192.168.1.13"
    exposure_us: 12000
    capture_trigger_mode: "continuous"
    detector: "v1"
    pipe_command: "\\\\.\\pipe\\camera-0-cmd"
    analysis_profile: "bench-lan1"
    pipe_command_linux: "/tmp/camera-0-cmd.sock"
  - id: 1
    enabled: true
    inspection_enabled: true
    ip: "169.254.79.219"
    exposure_us: 12000
    capture_trigger_mode: "continuous"
    detector: "v1"
    pipe_command: "\\\\.\\pipe\\camera-1-cmd"
    analysis_profile: "bench-lan3"
    pipe_command_linux: "/tmp/camera-1-cmd.sock"
  - id: 2
    enabled: true
    inspection_enabled: true
    ip: "169.254.100.219"
    exposure_us: 12000
    capture_trigger_mode: "continuous"
    detector: "v1"
    pipe_command: "\\\\.\\pipe\\camera-2-cmd"
    analysis_profile: "bench-lan4"
    pipe_command_linux: "/tmp/camera-2-cmd.sock"
  - id: 3
    enabled: true
    inspection_enabled: true
    ip: "169.254.105.1"
    exposure_us: 12000
    capture_trigger_mode: "continuous"
    detector: "v1"
    pipe_command: "\\\\.\\pipe\\camera-3-cmd"
    analysis_profile: "bench-lan5"
    pipe_command_linux: "/tmp/camera-3-cmd.sock"

java_geometry:
  pixels_to_mm: 0.01
  main_roi: { x: 0, y: 0, width: 2448, height: 2048 }
  joint_roi: null
  wrinkles_roi: null
  max_shift_mm: 0.5
  max_rotation_deg: 1.0
  max_concentricity_mm: 0.2
  max_joint_defect_mm: 0.3
  # Совпадает с python_detector.fallback_threshold, если не задан runtime threshold с фронта.
  # 0.45 снижает ложный брак на стабильных одинаковых кадрах.
  max_wrinkles_score: 0.45

python_detector:
  # FastAPI analisSurface — оркестратор поднимает uvicorn сам (integration.analis_surface_*).
  base_url: "http://127.0.0.1:8000"
  rois:
    - name: main
      x: 0
      y: 0
      width: 2448
      height: 2048
  # Более безопасный рабочий порог: меньше ложных REJECT при микро-шуме/свете.
  fallback_threshold: 0.45
  include_visuals: false

ui_http:
  enabled: true
  host: "127.0.0.1"
  port: 8099
  visuals_async_enabled: true
  visuals_queue_size: 8
  store_current_jpeg: true
  store_heatmap_u8: true
  client_preview_jpeg_quality: 58
  client_preview_max_width: 0

# HTTP API для фронта на том же порту, что ui_http (нужен ui_http.enabled: true).
# Прокси к analisSurface: путь /api/client/<...> → <kopcheni_base_url>/<...> (например /api/client/fp-zones → /fp-zones).
# geometry-runtime: GET/PUT/DELETE порогов и ROI для следующих вызовов java-geometry (поверх java_geometry в YAML).
client_api:
  enabled: true
  kopcheni_base_url: "http://127.0.0.1:8000"

# WebSocket UI (Фаза 1): hello + session_state; один клиент; ping по RFC6455; таймаут без входящих сообщений/pong.
client_ws:
  enabled: true
  host: "127.0.0.1"
  port: 8765
  path: "/"
  replace_existing_session: true
  ping_interval_ms: 20000
  read_idle_timeout_ms: 90000
  # Синхронизация эталона/FP в детектор по HTTP (тот же base_url, что python_detector).
  kopcheni_bundle_sync_enabled: true

client:
  url: "ws://127.0.0.1:8765"
  # Используется только если в integration.live_preview не задан interval_ms
  preview_max_fps: 1

robot:
  url: "http://127.0.0.1:9999"
  enabled: false

fanout:
  robot_tcp:
    host: "127.0.0.1"
    port: 9999
    connect_timeout_ms: 300
    write_timeout_ms: 300
    queue_size: 256
  client_http:
    host: "127.0.0.1"
    port: 8088
    queue_size: 128
    artificial_delay_ms: 1200

# Подсветка → LightServer.v3: COM = POST /api/com/light { state: On|Off, brightness: "80,..." } (банк COM из appsettings);
# сеть MV-LE = POST /api/light (deviceIndex из GET /api/devices). Яркость оркестратора: 0…100%.
light_servers:
  enabled: false
  fail_on_error: true
  # COM: первый POST может занять 8–12 s, если банк ещё не initialized (оркестратор ждёт GET /api/com/light)
  timeout_ms: 20000
  brightness_percent: 80
  # 0…255 в POST; для теста как Swagger: [5,5,5,5]. Уберите строку — будет только brightness_percent.
  # brightness_raw: [5, 5, 5, 5]
  duration_ms: 500
  # Пауза после POST On, до software trigger камеры (см. capture_trigger_mode).
  # Пауза после POST on (Hold/bank sync) до software trigger камеры
  flash_lead_ms: 80
  settle_delay_ms: 200
  endpoints:
    # COM1: 2 вспышки → LAN1 (cam 0), LAN3 (cam 1)
    - id: light-com1
      enabled: true
      type: com_io
      base_url: "http://127.0.0.1:5080"
      com_port: "COM1"
      com_ports: "COM1"
      brightness_percent: 80
      channels: [1, 2]
      camera_ids: [0, 1]
    # COM3: 4 вспышки → LAN4 (cam 2) каналы 1–2, LAN5 (cam 3) каналы 3–4
    - id: light-com3-lan4
      enabled: true
      type: com_io
      base_url: "http://127.0.0.1:5080"
      com_port: "COM3"
      com_ports: "COM3"
      brightness_percent: 80
      channels: [1, 2]
      camera_ids: [2]
    - id: light-com3-lan5
      enabled: true
      type: com_io
      base_url: "http://127.0.0.1:5080"
      com_port: "COM3"
      com_ports: "COM3"
      brightness_percent: 80
      channels: [3, 4]
      camera_ids: [3]
    # MV-LE по Ethernet: Open 0x80000203 на index 0 — включите после настройки device_index
    - id: light-mv-le
      enabled: false
      type: mv_le
      base_url: "http://127.0.0.1:5080"
      device_index: 1
      brightness_percent: 80
      channels: [1, 2, 3, 4]

integration:
  # camera — эталон снимается с камеры при старте; client — только client.reference_bundle по WebSocket.
  reference_source: client
  # Preview + вспышка On/Off по таймеру — всегда, без эталона. Инспекция — только после reference_bundle.
  live_preview:
    enabled: true
    flash_on_tick: false
    interval_ms: 5000
  camera_parallelism: 4
  geometry_pool_size: 2
  python_parallelism: 1
  stage_queue_size: 16
  worker_ipc_mode: "stdio"
  worker_named_pipe_template: "\\\\.\\pipe\\iml-camera-%d-binary"
  worker_named_pipe_template_linux: "/tmp/iml-camera-%d.pipe"
  worker_named_pipe_connect_timeout_ms: 3000
  # Дать dotnet/LightServer подняться до первого trigger (особенно при dotnet run + build).
  light_server_startup_delay_ms: 8000
  # Макс. длительность одного цикла инспекции на камеру (capture→fanout); при превышении — сброс in-flight.
  inspection_cycle_timeout_ms: 4000
  # Временная заглушка: цикл каждые N мс без внешнего триггера. Выключить при UDP-триггере с линии.
  dev_auto_trigger_stub:
    enabled: false
    interval_ms: 5000
  # Внешний триггер инспекции (когда dev_auto_trigger_stub и continuous_inspection выключены).
  inspection_trigger:
    udp:
      enabled: true
      bind_host: "0.0.0.0"
      bind_port: 9100
      # discrete: UDP 0x01 или "1" — общий триггер на все камеры; 0x00/"0" — без действия
      format: discrete
      debounce_ms: 100
      # allowed_remote_hosts: ["192.168.1.50"]
  # Видеопоток: WS client.stream_start/stop; кадры — GET /api/camera/{id}/stream.mjpeg (MJPEG).
  client_stream:
    default_max_fps: 20
    max_fps_cap: 30
  # Непрерывный цикл: вспышка → capture → geometry → python → fanout (робот выключен, триггер — ПО из оркестратора).
  continuous_inspection:
    enabled: true
    cycle_delay_ms: 400
  timing_stages_log:
    enabled: false
    file: "logs/pipeline-stages.jsonl"
  # JPEG кадров из SHM в каталог относительно корня репозитория (эталон: ref_*, инспекция: cap_*).
  save_captures:
    enabled: true
    directory: "testimage"
    jpeg_quality: 0.92
  # Автозапуск uvicorn (как LightServer). Один раз: pip install в analisSurface/backend/.venv
  analis_surface_autostart:
    enabled: true
    working_dir: "analisSurface/backend"
    startup_timeout_ms: 180000
    health_path: "/health"
  analis_surface_command_windows:
    - "analisSurface/backend/.venv/Scripts/python.exe"
    - "-m"
    - "uvicorn"
    - "app.main:app"
    - "--host"
    - "127.0.0.1"
    - "--port"
    - "8000"
  analis_surface_command_linux:
    - "analisSurface/backend/.venv/bin/python"
    - "-m"
    - "uvicorn"
    - "app.main:app"
    - "--host"
    - "127.0.0.1"
    - "--port"
    - "8000"
  geometry_command_windows:
    - "java"
    - "-jar"
    - "java-geometry-service/target/java-geometry-service-0.1.0-SNAPSHOT.jar"
  geometry_command_linux:
    - "java"
    - "-jar"
    - "java-geometry-service/target/java-geometry-service-0.1.0-SNAPSHOT.jar"
  # LightServer.v3 — COM IO + MV-LE на одном порту.
  light_server_command_windows:
    - "dotnet"
    - "exec"
    - "LightServer.v3/bin/Release/net10.0/LightServer.dll"
    - "--urls"
    - "http://127.0.0.1:5080"
  light_server_command_linux:
    - "dotnet"
    - "exec"
    - "LightServer.v3/bin/Release/net10.0/LightServer.dll"
    - "--urls"
    - "http://127.0.0.1:5080"

