test-runner: 
    image: ubuntu:24.04 
    tags: 
      - oleg-furer 
    script: 
      - echo "Runner работает!" 
      - uname -a 
      - cat /etc/os-release

checkout-front-end: 
    image: node:24-bookworm 
    tags: 
      - oleg-furer 
    variables:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    script: 
      - cd front-end
      - npm ci
      - npm test
      - npm run build

checkout-java:
    image: maven:3.9-eclipse-temurin-17 
    tags: 
      - oleg-furer 
    script: 
      - cd orchestrator-java 
      - mvn --batch-mode --no-transfer-progress verify
    artifacts: 
      when: always 
      expire_in: 14 days 
      reports: 
        junit: orchestrator-java/target/surefire-reports/TEST-*.xml

check-cpp: 
    image: ubuntu:24.04 
    tags: 
      - oleg-furer 
    variables: 
      DEBIAN_FRONTEND: noninteractive 
    before_script: 
      - apt-get update 
      - apt-get install -y --no-install-recommends build-essential cmake pkg-config libopencv-dev libcpp-httplib-dev nlohmann-json3-dev 
    script: 
      - cmake -S cppAnalisSurface -B cppAnalisSurface/build-test -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON 
      - cmake --build cppAnalisSurface/build-test --parallel 2 
      - ctest --test-dir cppAnalisSurface/build-test --output-on-failure
