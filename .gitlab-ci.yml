test-runner: 
    image: ubuntu:24.04 
    tags: 
      - oleg-furer 
    script: 
      - echo "Runner работает!" 
      - uname -a 
      - cat /etc/os-release

checkout-front-end: 
    image: node:24-bookworm 
    tags: 
      - oleg-furer 
    variables:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    script: 
      - cd front-end
      - npm ci
      - npm test
      - npm run build

checkout-java:
    image: maven:3.9-eclipse-temurin-17 
    tags: 
      - oleg-furer 
    script: 
      - cd orchestrator-java 
      - mvn --batch-mode --no-transfer-progress verify
