# Карта битов ПЛК для FINS (MAP 25_247, лист «Состояния / Неисправности / Управление»).
#
# === Как менять руками (без правки Java) ===
# Файл читается при старте оркестратора: plc_fins.register_map_path → этот YAML.
#
# У каждого сигнала важны только:
#   name            — ключ в API/UI. Не переименовывайте служебные:
#                     vision_ready, vision_fault, reject_line_1, reject_line_2
#                     (на них ссылаются 45-plc-fins.yaml и код брака).
#   area            — область памяти Omron: CIO | W | H | DM
#   address         — "слово.бит", как в CX-Programmer: "0.04", "240.15"
#   direction       — pc_to_plc = оркестратор/UI ПИШЕТ по FINS
#                     plc_to_pc = только ЧИТАЕМ с ПЛК (кнопки On/Off в UI скрыты)
#   bucket_group_id — только для брака: 0 → линия 1, 1 → линия 2
#
# FINS реально ходит на area+address.
#
# Runtime (эталон задан) — лист «Входы», Work Area:
#   vision_ready   → W0.04 sticky HIGH, пока session != NO_REFERENCE и сервисы здоровы
#   vision_fault   → W0.05 при аварии критичных сервисов (сброс после восстановления)
#   reject_line_1  → W0.06 импульс (bucket_group_id 0)
#   reject_line_2  → W0.07 импульс (bucket_group_id 1)
# Discrete DO — только если FINS publisher не создан (plc_fins.enabled=false).
#
# Таймауты D4400–D4404 — секция timeouts внизу (словная запись DM).

version: 1
map_id: "25_247"

signals:
  # ─── Техзрение PC→PLC · W0 (Входы.csv) ─────────────────────────────
  - name: vision_ready
    description: Техзрение готовность (W0.04)
    area: W
    address: "0.04"
    data_type: bool
    direction: pc_to_plc
    source_csv: "25_247_MAP - Входы.csv"

  - name: vision_fault
    description: Техзрение ошибка (W0.05)
    area: W
    address: "0.05"
    data_type: bool
    direction: pc_to_plc
    source_csv: "25_247_MAP - Входы.csv"

  - name: reject_line_1
    description: Техзрение брак линия 1 (W0.06)
    area: W
    address: "0.06"
    data_type: bool
    direction: pc_to_plc
    bucket_group_id: 0
    source_csv: "25_247_MAP - Входы.csv"

  - name: reject_line_2
    description: Техзрение брак линия 2 (W0.07)
    area: W
    address: "0.07"
    data_type: bool
    direction: pc_to_plc
    bucket_group_id: 1
    source_csv: "25_247_MAP - Входы.csv"

  # ─── Состояния · CIO 140 (чтение) ──────────────────────────────────
  - name: robot_working
    description: Робот работа
    area: CIO
    address: "140.00"
    data_type: bool
    direction: plc_to_pc
    source_csv: "25_247_MAP - Состояния-неисправности-управление.csv"

  - name: belt_motion_control
    description: Контроль движения ленты
    area: CIO
    address: "140.01"
    data_type: bool
    direction: plc_to_pc
    source_csv: "25_247_MAP - Состояния-неисправности-управление.csv"

  - name: alarm
    description: Авария
    area: CIO
    address: "140.15"
    data_type: bool
    direction: plc_to_pc
    source_csv: "25_247_MAP - Состояния-неисправности-управление.csv"

  # ─── Неисправности · CIO 191 (чтение) ──────────────────────────────

  - name: conveyor_fault_not_on
    description: Авария работы конвейера не включился
    area: CIO
    address: "191.00"
    data_type: bool
    direction: plc_to_pc
    source_csv: "25_247_MAP - Состояния-неисправности-управление.csv"

  - name: conveyor_fault_not_moving
    description: Авария работы конвейера не поехал сам
    area: CIO
    address: "191.01"
    data_type: bool
    direction: plc_to_pc
    source_csv: "25_247_MAP - Состояния-неисправности-управление.csv"

  # ─── Управление · CIO 240 ──────────────────────────────────────────
  - name: alarm_reset
    description: Сброс аварий
    area: CIO
    address: "240.00"
    data_type: bool
    direction: pc_to_plc
    source_csv: "25_247_MAP - Состояния-неисправности-управление.csv"

  - name: discrete_inputs_reset
    description: Сброс дискретных входов
    area: CIO
    address: "240.15"
    data_type: bool
    direction: pc_to_plc
    source_csv: "25_247_MAP - Состояния-неисправности-управление.csv"

# Таймауты отбраковки (DM, BCD, единицы 100 ms). Источник: Настройки.csv
timeouts:
  - name: reject_control_disable_timeout
    description: Тайм-аут отключения контроля отбраковки при отсутствии проезда в обратную сторону
    area: DM
    address: 4400
    display_address: D4400
    encoding: bcd
    unit: 100ms
    source_csv: "25_247_MAP - Настройки.csv"

  - name: reject_travel_with_main_timeout
    description: Тайм-аут длительности движения отбракованного ведёрка вместе с основным движением
    area: DM
    address: 4401
    display_address: D4401
    encoding: bcd
    unit: 100ms
    source_csv: "25_247_MAP - Настройки.csv"

  - name: reject_push_timeout
    description: Тайм-аут длительности толкания ведёрок отбраковкой
    area: DM
    address: 4402
    display_address: D4402
    encoding: bcd
    unit: 100ms
    source_csv: "25_247_MAP - Настройки.csv"

  - name: reject_buzzer_timeout
    description: Тайм-аут длительности звукового сигнала отбраковки
    area: DM
    address: 4403
    display_address: D4403
    encoding: bcd
    unit: 100ms
    source_csv: "25_247_MAP - Настройки.csv"

  - name: conveyor_cycle_watch_timeout
    description: Тайм-аут контроля что конвейер не поехал по циклу
    area: DM
    address: 4404
    display_address: D4404
    encoding: bcd
    unit: 100ms
    source_csv: "25_247_MAP - Настройки.csv"

  - name: conveyor_cycle_watch_timeout
    description: Переключение или ручки или метал
    area: DM
    address: 4405
    display_address: D4405
    encoding: bcd
    unit: 100ms
    source_csv: "25_247_MAP - Настройки.csv"
