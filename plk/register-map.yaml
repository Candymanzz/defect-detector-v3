# Нормализованная карта сигналов техзрения (MAP 25_247).
# FINS: только таймауты D4400–D4404 (Настройки).
# Дискретные входы: ready X4, fault X5, reject X6/X7 (IoInputMonitor DO).
# CIO 240.15 «Сброс дискретных входов» не используем.

version: 1
map_id: "25_247"

# Исходящие PC → PLC: runtime = discrete DI; адреса W/CIO — для документации / fallback FINS
signals:
  - name: vision_ready
    description: Техзрение готовность → физический вход X4 / CIO 10.04 → 140.02
    area: W
    address: "0.04"
    data_type: bool
    direction: pc_to_plc
    transport: discrete_di
    plc_input: X4
    mirror:
      area: CIO
      address: "140.02"
    source_csv: "25_247_MAP - Входы.csv"

  - name: vision_fault
    description: Техзрение ошибка → физический вход X5 / CIO 10.05 → 190.00
    area: W
    address: "0.05"
    data_type: bool
    direction: pc_to_plc
    transport: discrete_di
    plc_input: X5
    mirror:
      area: CIO
      address: "190.00"
    source_csv: "25_247_MAP - Входы.csv"

  - name: reject_line_1
    description: Техзрение брак линия 1 → физический вход X6 / CIO 10.06 → 140.08
    area: W
    address: "0.06"
    data_type: bool
    direction: pc_to_plc
    transport: discrete_di
    plc_input: X6
    bucket_group_id: 0
    mirror:
      area: CIO
      address: "140.08"
    source_csv: "25_247_MAP - Входы.csv"

  - name: reject_line_2
    description: Техзрение брак линия 2 → физический вход X7 / CIO 10.07 → 140.09
    area: W
    address: "0.07"
    data_type: bool
    direction: pc_to_plc
    transport: discrete_di
    plc_input: X7
    bucket_group_id: 1
    mirror:
      area: CIO
      address: "140.09"
    source_csv: "25_247_MAP - Входы.csv"

# Входящие от ПЛК (фаза 2 — триггер инспекции)
inputs:
  - name: robot_trigger
    description: Робот триггер
    area: W
    address: "0.02"
    data_type: bool
    direction: plc_to_pc
    source_csv: "25_247_MAP - Входы.csv"

# Таймауты отбраковки (DM, BCD, единицы 100 ms). Источник: Настройки.csv
timeouts:
  - name: reject_control_disable_timeout
    description: Тайм-аут отключения контроля отбраковки при отсутствии проезда в обратную сторону
    area: DM
    address: 4400
    display_address: D4400
    encoding: bcd
    unit: 100ms
    source_csv: "25_247_MAP - Настройки.csv"

  - name: reject_travel_with_main_timeout
    description: Тайм-аут длительности движения отбракованного ведёрка вместе с основным движением
    area: DM
    address: 4401
    display_address: D4401
    encoding: bcd
    unit: 100ms
    source_csv: "25_247_MAP - Настройки.csv"

  - name: reject_push_timeout
    description: Тайм-аут длительности толкания ведёрок отбраковкой
    area: DM
    address: 4402
    display_address: D4402
    encoding: bcd
    unit: 100ms
    source_csv: "25_247_MAP - Настройки.csv"

  - name: reject_buzzer_timeout
    description: Тайм-аут длительности звукового сигнала отбраковки
    area: DM
    address: 4403
    display_address: D4403
    encoding: bcd
    unit: 100ms
    source_csv: "25_247_MAP - Настройки.csv"

  - name: conveyor_cycle_watch_timeout
    description: Тайм-аут контроля что конвейер не поехал по циклу
    area: DM
    address: 4404
    display_address: D4404
    encoding: bcd
    unit: 100ms
    source_csv: "25_247_MAP - Настройки.csv"
