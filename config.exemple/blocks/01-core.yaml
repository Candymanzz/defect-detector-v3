version: 1

frame:
  width: 1224
  height: 1024
  # Mono8 с камеры: меньше GigE-трафик; в SHM кадр разворачивается в серый BGR8.
  format: Mono8
  # Binning 2×2 в MVS; если SDK вернёт 0x80000109 — worker применит ROI 1224×1024 по центру.
  binning_horizontal: 2
  binning_vertical: 2
  binning_mode: "Sum"

capture_source: "hik"
frame_timeout_ms: 15000
# GigE-топология: 5 коммутаторов, на каждом 2 камеры (пары id: 0+1, 2+3, … 8+9).
# gige_switch_buffer_kb — физический egress коммутатора (448 КБ). Должен совпадать с железом.
gige_switch_count: 5
gige_cameras_per_switch: 2
gige_switch_buffer_kb: 448
# Mono8 без искусственных межпакетных пауз; проверено на 10 камерах.
gige_inter_packet_delay: 0
# 0 = без сдвига передачи; -1 = автоматический расчёт, положительное значение = шаг в тиках.
gige_frame_transfer_delay_step: 0
# Две камеры на коммутатор; слоты используются только при ненулевом шаге передачи.
gige_ftd_cameras_per_link: 2

orchestrator:
  control_pipe: "\\\\.\\pipe\\iml-orchestrator"
  control_pipe_linux: "/tmp/iml-orchestrator.sock"

# camera — эталон снимается с камеры при старте; client — только client.reference_bundle по WebSocket.
integration:
  reference_source: client
  # false: DI3/триггер не стартует цикл, пока нет client.reference_bundle.
  capture_without_reference: true
  # Автосъёмка для UI отключена — кадры только по внешнему триггеру (встроенный MVS IO → inspection_trigger).
  live_preview:
    enabled: false
    flash_on_tick: false
    interval_ms: 8000
  camera_parallelism: 10
  # 0 = все камеры получают триггер одновременно.
  capture_trigger_stagger_ms: 0
  simultaneous_line_capture:
    enabled: true
    barrier_wait_ms: 0
    post_trigger_settle_ms: 0
    inter_wait_frame_ms: 0
    parallel_wait_frame: true
    # Все камеры передают кадры одной параллельной волной.
    transfer_wait_waves: 1
    transfer_wave_gap_ms: 0
  # Один C++-процесс: Java отправляет все камеры, CPU-параллелизм ограничен inspect_workers.
  python_parallelism: 10
  python_request_parallelism: 10
  python_server_pool_size: 1
  stage_queue_size: 20
  # Таймаут команд камер внутри JVM через JNI (health/capture/settings).
  worker_command_timeout_ms: 30000
  # Пауза между открытием камер через JNI (health идёт параллельно).
  worker_startup_stagger_ms: 0
  # Таймаут health/check для внешних сервисов (C++ detector).
  service_command_timeout_ms: 15000
  # Необязательно: camera_native_library: "camera-worker/build/libcamera_jni.so"
  # Камеры всегда работают через JNI; старые worker_ipc_mode/worker_named_pipe_* не используются.
  # Готовность встроенных вспышек ждём через awaitEndpointsReady — искусственная пауза не нужна.
  light_server_startup_delay_ms: 0
  # Таймаут полного цикла; камеры захватываются параллельно без искусственных пауз.
  inspection_cycle_timeout_ms: 3500
  # Агрегация: mode=ten_cameras → группы 0–4 и 5–9, все 10 камер в инспекции.
  inspection_bucket:
    enabled: true
    mode: ten_cameras
    timeout_ms: 3500
    line_broadcast_interval_ms: 3500
  # Временная заглушка: цикл каждые N мс без внешнего триггера. Выключить при UDP-триггере с линии.
  dev_auto_trigger_stub:
    enabled: false
    interval_ms: 5000
  # Видеопоток: WS client.stream_start/stop; кадры — GET /api/camera/{id}/stream.mjpeg (MJPEG).
  client_stream:
    default_max_fps: 20
    max_fps_cap: 30
  # Непрерывный цикл: вспышка → capture → C++ → вердикт (ПЛК + WebSocket UI).
  continuous_inspection:
    enabled: false
    cycle_delay_ms: 0
  timing_stages_log:
    enabled: true
    file: "logs/pipeline-stages.jsonl"
  # Downscale на ПК отключён: разрешение уже уменьшено binning 2×2 на камере.
  capture_frame_downscale:
    enabled: false
    scale: 1.0
    apply_to_inspection_capture: true
    apply_to_reference_capture: true
    apply_to_client_reference_bundle: true
  # JPEG кадров из SHM в каталог относительно корня репозитория (эталон: ref_*, инспекция: cap_*).
  save_captures:
    enabled: false
    directory: "testimage"
    jpeg_quality: 0.92
  # Отдельный C++-сервис; все потоки наследуют доступный набор CPU оркестратора.
  # Не использовать Python-обёртку с привязкой каждого процесса к одному CPU.
  analis_surface_autostart:
    enabled: true
    inspect_workers: 4
    working_dir: "cppAnalisSurface"
    startup_timeout_ms: 30000
    health_path: "/health"
  analis_surface_command_linux:
    - "cppAnalisSurface/build/cpp_analis_surface"
    - "--host"
    - "127.0.0.1"
    - "--port"
    - "8000"
    - "--data-dir"
    - "data"
  performance_log:
    enabled: true
    directory: "logs/performance"
    queue_capacity: 8192
  # Front-end (Vite + Electron) — npm run dev в front-end/.
  frontend_autostart:
    enabled: true
    startup_delay_ms: 0
    working_dir: "front-end"
  frontend_command_linux:
    - "npm"
    - "run"
    - "dev"
