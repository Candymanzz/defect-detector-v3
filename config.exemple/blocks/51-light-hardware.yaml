# Конфигурация вспышек встроенного Java-модуля; импортируется главным YAML.
#
# Ethernet MV-LE + COM MV-LE (camera id 2 и 7 — центральные).
# source_on/source_off можно переопределить отдельно в каждом устройстве.
# Bank On/Off: /api/orchestrator/light/bank на HTTP-порту оркестратора.

light_hardware:

  devices:
    # Центральные вспышки (camera id 2 и 7): один контроллер, 2 канала.
    - id: com1
      enabled: true
      type: com
      model_prefixes: [MV-LE]
      brightness_min: 0  # SDK brightness range; API remains 0..255 / UI 0..100%
      brightness_max: 255
      com_port_windows: COM1
      com_port_linux: ""  # REQUIRED: SDK port of the flash controller, e.g. COM_Port#ttyUSB0; not the IO port
      channels: 2
    - id: mv-le-1
      enabled: true
      type: ethernet
      model_prefixes: [MV-LE]
      brightness_min: 0
      brightness_max: 255
      ip: "169.254.220.23"
      channels: 4
    - id: mv-le-2
      enabled: true
      type: ethernet
      model_prefixes: [MV-LE]
      brightness_min: 0
      brightness_max: 255
      ip: "169.254.220.22"
      channels: 4
    - id: mv-le-3
      enabled: true
      type: ethernet
      model_prefixes: [MV-LE]
      brightness_min: 0
      brightness_max: 255
      ip: "169.254.220.2"
      channels: 4
    - id: mv-le-4
      enabled: true
      type: ethernet
      model_prefixes: [MV-LE]
      brightness_min: 0
      brightness_max: 255
      ip: "169.254.220.1"
      channels: 4

  # POST /api/camera-flash/pair — routes с 2+ каналами; /single — 1 канал (COM).
  # camera_number = camera id + 1. COM: id 2→3, id 7→8; Ethernet: остальные id 0–9.
  camera_routes:
    - camera_number: 1
      device_id: mv-le-3
      channels: [2, 4]
    - camera_number: 2
      device_id: mv-le-4
      channels: [2, 4]
    - camera_number: 3
      device_id: com1
      channels: [1]
    - camera_number: 4
      device_id: mv-le-3
      channels: [1, 3]
    - camera_number: 5
      device_id: mv-le-4
      channels: [1, 3]
    - camera_number: 6
      device_id: mv-le-2
      channels: [2, 4]
    - camera_number: 7
      device_id: mv-le-1
      channels: [2, 4]
    - camera_number: 8
      device_id: com1
      channels: [2]
    - camera_number: 9
      device_id: mv-le-2
      channels: [1, 3]
    - camera_number: 10
      device_id: mv-le-1
      channels: [1, 3]
