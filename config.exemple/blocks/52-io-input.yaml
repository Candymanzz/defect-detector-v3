# IoInputMonitor — мониторинг Digital Input с MV IO Box.

# Авто-поиск: config/blocks/52-io-input.yaml (или IO_INPUT_CONFIG / --io-config=).


io_input:
  com_port: COM3
  edge: both            # DI1/DI2: both; DI3 в коде всегда Rising (импульс <10 мс)
  # DI3 ~10 мс: SDK Glitch=0. Soft refractory ≥80 мс режет bounce Rising.
  debounce_ms: 0
  configure_sdk: true
  inputs:
    - 1                 # DI1 = работа (конвейер); ↓ снимает direction latch
    - 2                 # DI2 = направление
    - 3                 # DI3 = триггер съёмки
    - 4                 # DI4 = безопасное выключение (оркестратор: shutdown_port)
    - 5                 # DI5 = второй триггер съёмки

  # Единственный DO: capture DO5 → Line0 камер. Брак/ready/fault — только FINS.
  # DI3↑ → UDP (arm wait_frame) → delay → DO5↑ на каждый импульс (очередь, без SkipBusy).
  # DI4 публикуется в UDP; реакцию (гашение вспышек + stop) делает оркестратор.
  capture:
    enabled: true
    # timer = soft Timer5 Software; hardware = только listen/log DI (DO с платы)
    capture_strategy: direct
    direction_port: 2
    work_port: 1
    # DI1 публикуется как состояние линии, но не разоружает реальные DI3/DI5.
    # DI1 не блокирует DI3/DI5; используется только как телеметрия состояния линии.
    disarm_on_work_low: false
    channels:
      - trigger_port: 3
        output_port: 5
        timer_index: 5
      - trigger_port: 5
        output_port: 5
        timer_index: 5
    output_ports: [5]   # только DO5 → Line0
    output_mode: direct
    # MVS: Timer 5, Timer Trigger Source = Software; Out5 <- Timer5
    timer_index: 5
    # Согласовано с line0_trigger_activation в 01-core / config.json.
    line0_edge: rising
    active_high: true
    pulse_delay_ms: 0
    # По фронту DI3↑: DO5 сразу и ещё раз через 80 мс (от фронта, не после конца 1-го импульса).
    pulse_duration_ms: 50
    pulse_repeat: 1
    pulse_repeat_gap_ms: 80
    # Одно окно DI2=1: DI3↑ → DO5 один раз, DI5↑ → DO7 один раз.
    repeat_di3_capture: false
    max_di3_captures_per_di2_window: 1
    # DI2=1 — обязательное разрешение съёмки для DI3/DI5.
    require_direction: true
    direction_latch: false
    initial_direction: forward
    direction_http:
      enabled: true
      host: 127.0.0.1
      port: 9101

  publish:
    udp:
      enabled: true
      host: 127.0.0.1
      port: 9100          # куда слушает оркестратор (inspection_trigger.udp.bind_port)
      format: json        # json {"di":3,"value":1,"ts_ms":...} | text_di "3:1" | byte_di | byte/text (legacy 0/1)
      inputs: [1, 2, 3, 4, 5]   # какие DI публиковать; по умолчанию = inputs
      trigger_port: 3     # DI3 — не слать начальное состояние при старте (см. send_initial_trigger_state)
      low_latency_trigger: true   # DI1/DI2/DI3 — синхронный UDP из SDK callback, без очереди
      send_initial_state: true
      send_initial_trigger_state: false   # не слать DI3 при старте (ложный FIRE)
