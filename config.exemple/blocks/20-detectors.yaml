java_geometry:
  # При binning 2×2 мм/пиксель ≈ ×2 (перекалибровать по эталону при необходимости).
  pixels_to_mm: 0.02
  # Fallback ROI, если эталон не задан с клиента; морщины используют тот же ROI, что interest с эталона.
  main_roi: { x: 0, y: 0, width: 1224, height: 1024 }
  max_shift_mm: 0.5
  max_rotation_deg: 1.0
  # Шов этикетки (joint ROI): сегментация полосы, средняя ширина + клин сверху/снизу.
  # min смягчён: рабочие швы на стенде часто ~0.35–0.45 mm при pixels_to_mm=0.02.
  max_joint_defect_mm: 0.5
  # Min width применяется только если параллельность кромок НЕ ок;
  # при хорошей параллельности min-порог не валит шов (остаётся только max).
  joint_min_width_mm: 0.25
  joint_max_width_mm: 3.0
  # Ракурс снизу даёт сходимость кромок в кадре — допуск шире, чем для фронтального вида.
  # Параллельность двух кромок шва (горизонтальный/наклонный — ось из joint ROI).
  max_joint_parallelism_deg: 5.0
  # |widthStart − widthEnd| вдоль оси шва; перспектива даёт клин, реальный брак — больше порога.
  max_joint_taper_mm: 0.8
  # Если на соседних камерах шов почти не виден — ужесточённые пороги на уровне ведра
  # (только как доп. проверка, когда jointPass=false; при jointPass=true игнорируются).
  joint_sibling_min_visibility: 0.25
  max_joint_parallelism_deg_strict: 2.5
  joint_min_width_mm_strict: 0.4
  joint_max_width_mm_strict: 2.5
  # Сегментация полосы стыка + fitLine кромок (параллельность). Всегда включена.
  joint_seam_segmentation_enabled: true
  # 0..1: выше — легче захватить слабую полосу и жёстче допуск параллельности (вердикт).
  joint_seam_segmentation_sensitivity: 0.5
  # Порог морщин (геометрия: смещение + стык + морщины в переданном ROI).
  max_wrinkles_score: 0.45

# Нормализация позы изделия к эталону перед geometry / analisSurface.
# Позиционирование только выравнивает кадр — брак не ставит (fail_on_reject=false).
# Вердикт — у geometry / python. При неудачном align идём дальше с исходным кадром.
java_positioning:
  enabled: true
  fail_on_reject: false
  write_aligned: true
  pixels_to_mm: 0.02
  # Мягкие метрики в ответе (не гейтят PASS); QC допусков — у java_geometry после выравнивания.
  max_shift_mm: 9999.0
  max_rotation_deg: 9999.0

python_detector:
  # FastAPI analisSurface — оркестратор поднимает uvicorn сам (integration.analis_surface_*).
  base_url: "http://127.0.0.1:8000"
  # Downscale кадров перед inspect_shm (0.5 ≈ в 2.5× меньше пикселей, чем 0.8).
  inspect_scale: 0.5
  rois:
    - name: main
      x: 0
      y: 0
      width: 1224
      height: 1024
  # Более безопасный рабочий порог: меньше ложных REJECT при микро-шуме/свете.
  fallback_threshold: 0.45
  # UI heatmap is written at this width after the full-resolution inspection decision is calculated.
  ui_heatmap_max_width: 512
  include_visuals: false
  # Файловые логи analisSurface (backend/logs/...): requests, responses, analysis, errors, slow.
  # Читает Python при старте из config/config.yaml (без изменений Java). false — отключить на длительных прогонах.
  file_logging: false
