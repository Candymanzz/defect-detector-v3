# Omron FINS/UDP — ready, режим ручки, таймауты и остальные сигналы.
# Брак отправляется через DO из blocks/52-io.yaml; reject-регистры FINS исключены.
# Карта: plk/register-map.yaml.
#
# vision_ready: эталон активен AND критичные сервисы здоровы.
# vision_fault: отправляется через integration.io_fault (Timer2/Out2), без записи FINS.
# Выход процесса frontend → полный shutdown оркестратора → vision_ready принудительно 0.

plc_fins:
  enabled: true
  host: "169.254.220.232"
  port: 9600
  dest_node: 231
  src_node: 254
  response_timeout_ms: 1000
  pulse_ms: 80
  queue_size: 64
  register_map_path: "plk/register-map.yaml"
  vision_ready_signal: "vision_ready"
  vision_fault_signal: "vision_fault"
